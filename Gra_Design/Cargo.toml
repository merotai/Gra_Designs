[package]
name = "Gra_Design"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "gd_connect",
    "gd_server",
    "gd_common",
    "gd_algorithm",
]

[dependencies]
gd_common = {workspace = true}
gd_connect = {workspace = true}
gd_algorithm = {workspace = true}
gd_server = {workspace = true}


tokio = { workspace = true }
actix-web = {workspace = true}
anyhow = {workspace = true}
tracing = {workspace = true}

rumqttc = {workspace = true}








[workspace.dependencies]

gd_connect = {path = "./gd_connect" }
gd_server = { path = "./gd_server"}
gd_common = {path = "./gd_common"}
gd_algorithm = {path = "./gd_algorithm"}


tokio = { version = "1.52.0",features = ["full"] }
tokio-stream = {version = "0.1.18"}
rumqttc = {version = "0.25.0",features = ["default"]}

anyhow = { version = "1.0.100" }
tracing = { version = "0.1.44" }

actix-web = { version = "4.13.0" }
actix-cors = {version = "0.7.1"}

serde = { version = "1.0.228" }
serde_json = {version = "1.0.149"}
mongodb = {version = "3.6.0"}

lettre = {version = "0.11.21"}
dotenv = {version = "0.15.0"}

crc = {version = "3.4.0"}
bytemuck = {version = "1.25.0",features = ["derive"]}

chrono = {version = "0.4.44",features = ["now"]}
